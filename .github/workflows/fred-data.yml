name: FRED verisini güncelle / Update FRED data

# Laboratuvarın tarayıcıdaki alıştırmalarında kullanılan FRED serilerinin anlık görüntüsünü
# her ayın 3'ünde (ve elle tetiklendiğinde) indirir. Seriler data/fred/ klasörüne yazılır.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fred-data.yml"
      - "data/fred/series.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İndir / Download
        run: |
          set -e
          while read -r id; do
            [ -z "$id" ] && continue
            curl -sSfL --retry 3 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}" -o "data/fred/${id}.csv"
            echo "${id}: $(wc -l < data/fred/${id}.csv) satır"
          done < data/fred/series.txt
          date -u +"%Y-%m-%d" > data/fred/LAST_UPDATED
      - name: Kaydet / Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fred
          git diff --cached --quiet || git commit -m "FRED verisi güncellendi / FRED data updated"
          git push
